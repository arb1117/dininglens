name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck app + syntax-check server
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test -- --ci
        env:
          ANTHROPIC_API_KEY: ci-placeholder
